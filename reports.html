<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reports · Ganesh Mandal</title><link rel="stylesheet" href="css/style.css"><script>document.documentElement.dataset.theme=localStorage.getItem('gm_theme')||'light'</script></head>
<body data-page="reports"><aside class="sidebar" id="sidebar"></aside><div class="content"><header class="topbar" id="topbar"></header><main>

</main></div><script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script><script src="js/config.js"></script><script src="js/storage.js"></script><script src="js/app.js"></script><script src="js/reports.js"></script></body></html>
